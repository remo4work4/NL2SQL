# Phase 9 多实例部署编排（Docker 环境一键部署，见 README）
# 启动：docker compose up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nl2sqlpg}
      POSTGRES_DB: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chroma:
    image: chromadb/chroma:latest
    command: uvicorn chromadb.app:app --host 0.0.0.0 --port 8002 --workers 1
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
    ports:
      - "8002:8002"

  modelsvc:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.modelsvc:app --host 0.0.0.0 --port 8004
    volumes:
      - ./backend/models:/app/models  # BGE 模型（首次需下载到 backend/models/）
    ports:
      - "8004:8004"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    environment:
      PG_DSN: postgresql://nl2sql:nl2sql@postgres:5432/nl2sql
      PG_BUSINESS_DSN: postgresql://nl2sql_ro:nl2sql_ro@postgres:5432/nl2sql
      REDIS_URL: redis://redis:6379/0
      CHROMA_MODE: server
      CHROMA_HOST: chroma
      CHROMA_PORT: "8002"
      MODEL_SERVICE_URL: http://modelsvc:8004
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
      modelsvc:
        condition: service_started
    ports:
      - "8001:8000"
    deploy:
      replicas: 2

volumes:
  pg_data:
  chroma_data:
